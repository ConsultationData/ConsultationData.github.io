name: Update Blog Articles

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 1 * *"

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update blog articles
        run: python update_blog.py

      - name: Commit changes
        shell: bash
        run: |
          git config --global user.name "consultation-data-bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add blog-data.json
          if git diff --cached --quiet; then
            echo "Aucune mise à jour."
          else
            git commit -m "Mise à jour mensuelle du blogue"
            git push
          fi
